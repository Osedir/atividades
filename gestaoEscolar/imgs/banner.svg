<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-label="Sistema de Gerenciamento Escolar v1.0">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="800" height="900" fill="url(#fundo)"/>
  <circle cx="680" cy="120" r="180" fill="#ffffff" opacity="0.05"/>
  <circle cx="90" cy="800" r="220" fill="#ffffff" opacity="0.05"/>

  <!-- frase -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="400" y="230" font-size="64" font-weight="700">Sistema de</text>
    <text x="400" y="310" font-size="64" font-weight="700">Gerenciamento</text>
    <text x="400" y="390" font-size="64" font-weight="700">Escolar</text>
    <text x="400" y="460" font-size="44" font-weight="400" fill="#fbbf24">v1.0</text>
  </g>

  <!-- sombra -->
  <ellipse cx="400" cy="800" rx="270" ry="22" fill="#000000" opacity="0.25"/>

  <!-- livro grande (base) -->
  <rect x="150" y="730" width="500" height="64" rx="6" fill="#dc2626"/>
  <rect x="150" y="730" width="500" height="12" rx="4" fill="#ef4444"/>
  <rect x="165" y="752" width="470" height="30" fill="#fef3c7"/>
  <rect x="150" y="730" width="22" height="64" fill="#991b1b"/>

  <!-- livro do meio -->
  <rect x="190" y="668" width="420" height="62" rx="6" fill="#16a34a"/>
  <rect x="190" y="668" width="420" height="12" rx="4" fill="#22c55e"/>
  <rect x="205" y="690" width="390" height="30" fill="#fef3c7"/>
  <rect x="190" y="668" width="22" height="62" fill="#166534"/>

  <!-- livro de cima -->
  <rect x="230" y="610" width="340" height="58" rx="6" fill="#f59e0b"/>
  <rect x="230" y="610" width="340" height="11" rx="4" fill="#fbbf24"/>
  <rect x="245" y="631" width="310" height="28" fill="#fef3c7"/>
  <rect x="230" y="610" width="22" height="58" fill="#b45309"/>

  <!-- livro aberto no topo -->
  <g transform="translate(400 575)">
    <path d="M0 0 C-60 -30 -150 -30 -190 -10 L-190 30 C-150 10 -60 10 0 40 Z" fill="#ffffff"/>
    <path d="M0 0 C60 -30 150 -30 190 -10 L190 30 C150 10 60 10 0 40 Z" fill="#e0e7ff"/>
    <path d="M0 0 L0 40" stroke="#94a3b8" stroke-width="3"/>
    <g stroke="#93c5fd" stroke-width="3" stroke-linecap="round">
      <path d="M-160 2 C-120 -8 -70 -6 -20 12"/>
      <path d="M-160 16 C-120 6 -70 8 -20 26"/>
      <path d="M160 2 C120 -8 70 -6 20 12"/>
      <path d="M160 16 C120 6 70 8 20 26"/>
    </g>
  </g>

  <!-- livros em pé à direita -->
  <rect x="660" y="640" width="34" height="154" rx="4" fill="#9333ea"/>
  <rect x="696" y="660" width="30" height="134" rx="4" fill="#0891b2"/>
  <rect x="728" y="628" width="32" height="166" rx="4" fill="#e11d48"/>
  <rect x="660" y="670" width="34" height="8" fill="#ffffff" opacity="0.5"/>
  <rect x="696" y="690" width="30" height="8" fill="#ffffff" opacity="0.5"/>
  <rect x="728" y="660" width="32" height="8" fill="#ffffff" opacity="0.5"/>
</svg>
