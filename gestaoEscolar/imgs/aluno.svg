<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-label="Aluno: menino com mochila nas costas e livros no braço">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="800" height="900" fill="url(#fundo)"/>
  <circle cx="680" cy="130" r="180" fill="#ffffff" opacity="0.05"/>
  <circle cx="90" cy="810" r="220" fill="#ffffff" opacity="0.05"/>

  <!-- título -->
  <text x="400" y="190" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="700" fill="#ffffff" text-anchor="middle">Aluno</text>

  <!-- sombra no chão -->
  <ellipse cx="400" cy="855" rx="190" ry="20" fill="#000000" opacity="0.25"/>

  <!-- mochila (atrás do corpo) -->
  <rect x="252" y="432" width="296" height="280" rx="46" fill="#dc2626"/>
  <rect x="290" y="570" width="220" height="110" rx="20" fill="#b91c1c"/>
  <rect x="252" y="432" width="296" height="24" rx="12" fill="#ef4444"/>

  <!-- pernas -->
  <rect x="332" y="690" width="64" height="140" rx="10" fill="#1e293b"/>
  <rect x="404" y="690" width="64" height="140" rx="10" fill="#1e293b"/>
  <!-- tênis -->
  <ellipse cx="358" cy="836" rx="48" ry="18" fill="#f8fafc"/>
  <ellipse cx="442" cy="836" rx="48" ry="18" fill="#f8fafc"/>
  <rect x="318" y="842" width="88" height="6" rx="3" fill="#94a3b8"/>
  <rect x="396" y="842" width="88" height="6" rx="3" fill="#94a3b8"/>

  <!-- tronco (camiseta) -->
  <rect x="310" y="440" width="180" height="270" rx="42" fill="#f1f5f9"/>
  <!-- short/calça cobrindo a base do tronco -->
  <rect x="310" y="660" width="180" height="60" rx="14" fill="#1e293b"/>

  <!-- alças da mochila -->
  <rect x="330" y="445" width="26" height="200" rx="12" fill="#991b1b"/>
  <rect x="444" y="445" width="26" height="200" rx="12" fill="#991b1b"/>

  <!-- pescoço -->
  <rect x="383" y="405" width="34" height="48" rx="10" fill="#f1c27d"/>

  <!-- braço esquerdo (do menino, lado esquerdo da imagem) pendurado -->
  <rect x="270" y="452" width="46" height="150" rx="23" fill="#f1f5f9"/>
  <rect x="274" y="580" width="38" height="70" rx="19" fill="#f1c27d"/>
  <circle cx="293" cy="656" r="22" fill="#f1c27d"/>

  <!-- livros carregados no braço direito -->
  <rect x="408" y="548" width="140" height="24" rx="4" fill="#2563eb"/>
  <rect x="408" y="548" width="140" height="6" rx="3" fill="#60a5fa"/>
  <rect x="414" y="572" width="128" height="24" rx="4" fill="#16a34a"/>
  <rect x="414" y="572" width="128" height="6" rx="3" fill="#4ade80"/>
  <rect x="406" y="596" width="142" height="26" rx="4" fill="#f59e0b"/>
  <rect x="406" y="596" width="142" height="6" rx="3" fill="#fbbf24"/>
  <rect x="424" y="552" width="110" height="16" fill="#fef3c7" opacity="0.0"/>

  <!-- braço direito: manga + antebraço segurando os livros -->
  <rect x="484" y="452" width="46" height="186" rx="23" fill="#f1f5f9"/>
  <rect x="396" y="604" width="144" height="34" rx="17" fill="#f1c27d"/>
  <circle cx="404" cy="621" r="19" fill="#f1c27d"/>

  <!-- cabeça -->
  <circle cx="330" cy="352" r="14" fill="#f1c27d"/>
  <circle cx="470" cy="352" r="14" fill="#f1c27d"/>
  <circle cx="400" cy="350" r="72" fill="#f1c27d"/>
  <!-- cabelo -->
  <path d="M326 345 C318 262 482 262 474 345 C455 308 345 308 326 345 Z" fill="#3b2314"/>
  <!-- rosto -->
  <circle cx="374" cy="352" r="7" fill="#1e293b"/>
  <circle cx="426" cy="352" r="7" fill="#1e293b"/>
  <circle cx="357" cy="376" r="9" fill="#f87171" opacity="0.45"/>
  <circle cx="443" cy="376" r="9" fill="#f87171" opacity="0.45"/>
  <path d="M376 382 Q400 404 424 382" fill="none" stroke="#7c2d12" stroke-width="5" stroke-linecap="round"/>
</svg>
