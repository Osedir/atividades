<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-label="Professor: professor com óculos segurando um livro diante de uma lousa">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="800" height="900" fill="url(#fundo)"/>
  <circle cx="680" cy="130" r="180" fill="#ffffff" opacity="0.05"/>
  <circle cx="90" cy="810" r="220" fill="#ffffff" opacity="0.05"/>

  <!-- título -->
  <text x="400" y="190" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="700" fill="#ffffff" text-anchor="middle">Professor</text>

  <!-- lousa ao fundo -->
  <rect x="150" y="270" width="500" height="320" rx="10" fill="#92400e"/>
  <rect x="164" y="284" width="472" height="292" rx="6" fill="#14532d"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="46" fill="#f8fafc" opacity="0.85">
    <text x="190" y="350">2 + 3 = 5</text>
    <text x="500" y="350">A B C</text>
    <text x="190" y="410">x² = 9</text>
  </g>
  <path d="M190 450 L330 450 M190 490 L280 490" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <rect x="150" y="590" width="500" height="14" rx="5" fill="#78350f"/>

  <!-- sombra no chão -->
  <ellipse cx="400" cy="858" rx="190" ry="20" fill="#000000" opacity="0.25"/>

  <!-- pernas -->
  <rect x="332" y="690" width="64" height="150" rx="10" fill="#1e293b"/>
  <rect x="404" y="690" width="64" height="150" rx="10" fill="#1e293b"/>
  <!-- sapatos -->
  <ellipse cx="354" cy="846" rx="48" ry="16" fill="#292524"/>
  <ellipse cx="446" cy="846" rx="48" ry="16" fill="#292524"/>

  <!-- tronco: paletó -->
  <rect x="304" y="440" width="192" height="270" rx="40" fill="#475569"/>
  <!-- camisa e gravata -->
  <path d="M368 440 L400 520 L432 440 Z" fill="#f8fafc"/>
  <path d="M392 470 L408 470 L414 560 L400 580 L386 560 Z" fill="#dc2626"/>
  <!-- lapelas -->
  <path d="M368 440 L388 560 L340 500 Z" fill="#334155"/>
  <path d="M432 440 L412 560 L460 500 Z" fill="#334155"/>

  <!-- pescoço -->
  <rect x="383" y="405" width="34" height="46" rx="10" fill="#e0ac69"/>

  <!-- braço esquerdo (lado esquerdo da imagem) pendurado -->
  <rect x="266" y="450" width="50" height="190" rx="25" fill="#475569"/>
  <circle cx="291" cy="648" r="22" fill="#e0ac69"/>

  <!-- livro segurado ao lado do corpo -->
  <rect x="520" y="560" width="100" height="130" rx="8" fill="#dc2626"/>
  <rect x="520" y="560" width="14" height="130" rx="6" fill="#991b1b"/>
  <rect x="544" y="590" width="60" height="10" rx="5" fill="#fef3c7"/>
  <rect x="544" y="612" width="44" height="10" rx="5" fill="#fef3c7"/>

  <!-- braço direito segurando o livro -->
  <rect x="484" y="450" width="50" height="170" rx="25" fill="#475569"/>
  <circle cx="530" cy="645" r="22" fill="#e0ac69"/>

  <!-- cabeça -->
  <circle cx="332" cy="352" r="14" fill="#e0ac69"/>
  <circle cx="468" cy="352" r="14" fill="#e0ac69"/>
  <circle cx="400" cy="348" r="70" fill="#e0ac69"/>
  <!-- cabelo grisalho -->
  <path d="M330 340 C322 264 478 264 470 340 C452 306 348 306 330 340 Z" fill="#cbd5e1"/>
  <!-- óculos -->
  <circle cx="373" cy="352" r="19" fill="#f8fafc" fill-opacity="0.35" stroke="#1e293b" stroke-width="5"/>
  <circle cx="427" cy="352" r="19" fill="#f8fafc" fill-opacity="0.35" stroke="#1e293b" stroke-width="5"/>
  <path d="M392 352 L408 352" stroke="#1e293b" stroke-width="5"/>
  <circle cx="373" cy="352" r="6" fill="#1e293b"/>
  <circle cx="427" cy="352" r="6" fill="#1e293b"/>
  <!-- sorriso -->
  <path d="M376 384 Q400 404 424 384" fill="none" stroke="#7c2d12" stroke-width="5" stroke-linecap="round"/>
</svg>
