<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fale conosco</title>
  <link rel="stylesheet" href="../css/menu.css">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/contato.css">
</head>
<body>
  <div class="pagina">

    <h1>Fale conosco</h1>

    <form class="formulario" action="#" method="get">
      <input type="text" name="nome" placeholder="Nome do Aluno" aria-label="Nome" required>
      <input type="number" name="matricula" placeholder="Matrícula" aria-label="Matrícula" required>
      <input type="email" name="email" placeholder="Email" aria-label="Email" required>
      <textarea name="mensagem" rows="6" placeholder="Descreva o assunto ou problema" aria-label="Mensagem" required></textarea>
      <button type="submit">Enviar</button>
    </form>

  </div>
</body>
</html>
