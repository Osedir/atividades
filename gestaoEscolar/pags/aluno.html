<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do Aluno</title>
  <link rel="stylesheet" href="../css/estilo.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <div class="tela">

    <div class="painel-esquerdo">
      <img src="../imgs/aluno.svg" alt="Aluno: menino com mochila nas costas e livros no braço">
    </div>

    <div class="painel-direito">
      <form class="formulario" action="paginaaluno.html" method="get">
        <input type="number" name="matricula" placeholder="Matrícula" aria-label="Matrícula" required>
        <input type="password" name="senha" placeholder="Senha" aria-label="Senha" required>
        <button type="submit">Entrar</button>
      </form>
    </div>

  </div>
</body>
</html>
